name: Publish release

# When docs/RELEASES.md changes on the branch, publish the DMG from the latest successful
# "Build and test macOS app" run as a GitHub Release named after APP_VERSION in app.py.
# Reuses the tested DMG (no rebuild); does nothing if that release already exists.
on:
  push:
    branches: ['claude/**']
    paths: ['docs/RELEASES.md', '.github/workflows/release.yml']

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide version
        run: |
          VERSION=$(python3 -c "import re;print(re.search(r\"APP_VERSION = '([^']+)'\", open('app.py').read()).group(1))")
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "EXISTS=1" >> "$GITHUB_ENV"; fi
      - name: Fetch the tested DMG
        if: env.EXISTS != '1'
        run: |
          RUN=$(gh run list -R "$GITHUB_REPOSITORY" --workflow build-mac.yml --branch "$GITHUB_REF_NAME" \
                --status success --limit 1 --json databaseId -q '.[0].databaseId')
          echo "Using build run $RUN"
          gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n PhotoSelect-AppleSilicon-dmg -D dist
          (cd dist && shasum -a 256 -c PhotoSelect-AppleSilicon.dmg.sha256)
          {
            echo "Apple silicon Mac app. Download PhotoSelect-AppleSilicon.dmg, open it and drag PhotoSelect to Applications."
            echo "It is ad-hoc signed, not notarised: on first launch use System Settings, Privacy & Security, Open Anyway (see INSTALL.md)."
            echo ""
            echo "Built and acceptance-tested on macOS 14 and 15: https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN"
            echo ""
            echo "Nikon High Efficiency (HE / HE★) NEF cannot be decoded by the bundled LibRaw; use Lossless compressed NEF."
            echo ""
            echo "Changes: see docs/RELEASES.md"
          } > notes.md
      - name: Create release
        if: env.EXISTS != '1'
        run: |
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "PhotoSelect ${TAG#v} (Apple silicon)" --notes-file notes.md \
            dist/PhotoSelect-AppleSilicon.dmg dist/PhotoSelect-AppleSilicon.dmg.sha256
