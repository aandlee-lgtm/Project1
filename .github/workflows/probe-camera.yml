name: Probe camera RAW support

on:
  push:
    branches: ['claude/**']
    paths: ['scripts/probe_camera.py', 'scripts/probe_apple_raw.py', '.github/workflows/probe-camera.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet rawpy==0.27.1 exifread==3.5.1 pillow==12.3.0 numpy==2.5.3
      - run: python scripts/probe_camera.py "Z 6III" "Z6III" "Z 6_3" "Z 6 III"

  apple-raw:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m venv "$RUNNER_TEMP/v" && "$RUNNER_TEMP/v/bin/pip" install --quiet pyobjc-framework-Quartz numpy pillow rawpy==0.27.1
          sw_vers
          B=https://raw.pixls.us/data/NIKON%20CORPORATION/NIKON%20Z6_3
          "$RUNNER_TEMP/v/bin/python" scripts/probe_apple_raw.py "$B/Nikon_Z6__3_High_Efficiency_FX.NEF" "$B/Nikon_Z6__3_High_Efficiency_Star_FX.NEF" "$B/Nikon_Z6__3_Lossless_compressed_FX.NEF"
