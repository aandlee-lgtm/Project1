name: Sony A7 / A9 RAW coverage

# Decodes every Sony A7 / A9 sample on raw.pixls.us with the rawpy / LibRaw version bundled in the app.
# A check, not a build: it runs when the coverage script changes, or on demand.
on:
  push:
    branches: ['claude/**']
    paths: ['scripts/sony_coverage.py', '.github/workflows/sony-coverage.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sony-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decoder (pinned like the app)
        run: pip install --quiet $(grep -E '^(rawpy|numpy|pillow|exifread)==' requirements-mac.txt)
      - name: Sony A7 / A9 coverage
        run: python scripts/sony_coverage.py "$RUNNER_TEMP/sony"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sony-coverage
          path: |
            ${{ runner.temp }}/sony/coverage.md
            ${{ runner.temp }}/sony/coverage.json
